<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>말의 묘역 - 실시간 투표</title>
    
    <!-- 폰트 로드 -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           1. 기본 설정 및 폰트
           ========================================= */
        :root {
            --text-color: #e0e0e0;
            --accent-color: #8b0000;
            --agree-color: #2e7d32;    /* 찬성 초록색 */
            --disagree-color: #c62828; /* 반대 빨간색 */
        }

        @font-face {
            font-family: 'DXTypeB-KSCpc-EUC-H';
            src: local('DXTypeB-KSCpc-EUC-H'), local('DXTypeB');
        }

        body
         {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-image: url('https://i.imgur.com/YvvUntE.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'DXTypeB-KSCpc-EUC-H', 'DXTypeB', 'Gowun Batang', serif;
            color: var(--text-color);
            user-select: none;
            touch-action: none;
        }

        /* =========================================
           2. 상단 헤더
           ========================================= */
        header {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            width: 90%;
            display: flex;
            justify-content: center;
        }

        header img {
            width: 100%;
            max-width: 800px;
            height: auto;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.8));
        }

        /* =========================================
           3. 묘비 스타일
           ========================================= */
        .graveyard-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        .tombstone {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            transition: box-shadow 0.3s ease, filter 0.3s ease;
            touch-action: none;
        }

        .tombstone:active {
            cursor: grabbing;
            z-index: 1000 !important;
        }

        .tombstone img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.8));
            pointer-events: none;
        }

        .tombstone-text {
            position: absolute;
            color: #000000; 
            text-shadow: 0 0 3px rgba(255, 255, 255, 0.8); 
            font-weight: bold;
            font-size: 15px;
            text-align: center;
            white-space: nowrap;
            width: 100%;
            pointer-events: none;
        }

        .tombstone[data-img-idx="0"] .tombstone-text { top: 50%; left: 0%; }
        .tombstone[data-img-idx="1"] .tombstone-text { top: 60%; left: 0%; }
        .tombstone[data-img-idx="2"] .tombstone-text { top: 50%; left: 0%; }
        .tombstone[data-img-idx="3"] .tombstone-text { top: 63%; left: 0%; }
        .tombstone[data-img-idx="4"] .tombstone-text { top: 50%; left: 0%; }
        .tombstone[data-img-idx="5"] .tombstone-text { top: 50%; left: 0%; }

        .highlighted { animation: halo-pulse 1.5s infinite alternate; }
        @keyframes halo-pulse {
            from { filter: drop-shadow(0 0 5px var(--accent-color)); }
            to { filter: drop-shadow(0 0 20px var(--accent-color)); }
        }

        /* [수정 완료] 새로 생긴 묘비에 회색 빛 애니메이션 적용 */
        .just-born img {
            animation: holy-light 5s ease-out forwards;
        }

        @keyframes holy-light {
            0% {
                /* 밝은 회색(은색) 후광, 밝기 조절 */
                filter: brightness(2.0) drop-shadow(0 0 30px #e0e0e0);
                transform: scale(1.05);
            }
            80% {
                /* 빛이 서서히 줄어듦 */
                filter: brightness(1.1) drop-shadow(0 0 10px #e0e0e0);
            }
            100% {
                /* 원래 상태로 복귀 */
                filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.8));
                transform: scale(1);
            }
        }

        /* =========================================
           4. UI 요소 (검색, 버튼)
           ========================================= */
        .search-container {
            position: fixed;
            bottom: 30px; left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }

        .search-input {
            width: 300px; padding: 12px 20px;
            border-radius: 30px;
            border: 2px solid var(--accent-color);
            background-color: rgba(0, 0, 0, 0.7);
            color: var(--text-color);
            font-family: inherit; font-size: 16px;
            text-align: center; outline: none;
            transition: background-color 0.3s;
        }
        .search-input:focus { background-color: rgba(0, 0, 0, 0.9); }

        /* ▼▼▼ .add-btn 관련 코드를 이걸로 싹 덮어쓰세요 ▼▼▼ */
        .add-btn {
            /* 1. 위치 고정 (우측 하단) */
            position: fixed;
            bottom: 30px; 
            right: 10px;
            
            /* 2. 버튼 크기 (이미지 크기에 맞춰 조절하세요) */
            width: 100px;   
            height: 100px; 
            
            /* 3. 배경, 테두리, 원형 모양 모두 제거 -> 투명하게 */
            background: none;
            border: none;
            border-radius: 0;
            padding: 0;
            box-shadow: 4; /* 그림자도 제거 (원하면 남겨도 됨) */
            
            /* 4. 기타 필수 설정 */
            z-index: 100;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 이미지 스타일 */
        .add-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 이미지 비율 유지하며 꽉 채움 */
            display: block;
            filter: drop-shadow(0 4px 5px rgba(0,0,0,0.5)); /* 이미지 자체에 그림자 효과 */
        }

        /* 마우스 올렸을 때 살짝 커짐 */
        .add-btn:hover {
            transform: scale(1.1);
            background: none; /* 배경색 안 생기게 방지 */
        }
        .add-btn:hover img {
            /* x좌표, y좌표, 번짐정도, 색상 */
            /* 빨간색(#ff0000) 빛이 15px 만큼 퍼짐 */
            filter: drop-shadow(0 0 15px #ff0000); 
        }
        
        .modal-overlay {
            display: none;
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 2000;
            justify-content: center; align-items: center;
        }
        /* ▼▼▼ .modal 스타일을 이걸로 교체하세요 ▼▼▼ */
        .modal {
            /* 1. 배경 이미지 설정 */
            background-image: url('https://i.imgur.com/ALod4q5.png'); 
            background-size: contain; /* 이미지가 잘리지 않고 다 보이게 */
            background-repeat: no-repeat;
            background-position: center;
            
            /* 2. 기존의 네모난 배경과 테두리 제거 */
            background-color: transparent; 
            border: none;
            box-shadow: none; /* 이미지 자체 그림자가 없다면 filter: drop-shadow(...) 추가 가능 */

            /* 3. 크기 설정 (이미지 비율에 맞춰서 조절 필요) */
            width: 350px;   /* 너비 */
            height: 450px;  /* 높이 */
            
            /* 4. 내용 정렬 (글자와 입력창을 중앙에 배치) */
            padding: 40px; /* 테두리 안쪽 여백 (글자가 이미지 밖으로 안 나가게 조절) */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            text-align: center;
        }

        /* 💡 팁: 배경이 이미지가 되면 입력창(input)도 어울리게 투명하게 바꾸면 좋습니다 */
        .modal-input {
            width: 80%;
            margin-bottom: 10px;
            padding: 8px;
            /* 배경을 반투명 검정으로 */
            background: rgba(0, 0, 0, 0.5); 
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 4px;
        }

        /* =========================================
           5. 투표 버튼 스타일
           ========================================= */
        .vote-container {
            display: flex;
            justify-content: space-around;
            margin-top: 25px;
            width: 100%;
        }
        .vote-btn-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .vote-btn {
            width: 40px; height: 40px;
            border-radius: 30%;
            border: 2px solid rgba(255,255,255,0.2);
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex; align-items: center; justify-content: center;
            color: white;
            margin-bottom: 10px;
        }
        .vote-btn:active { transform: scale(0.9); }
        
        .vote-btn.agree { background-color: var(--agree-color); }
        .vote-btn.agree:hover { box-shadow: 0 0 15px var(--agree-color); }
        
        .vote-btn.disagree { background-color: var(--disagree-color); }
        .vote-btn.disagree:hover { box-shadow: 0 0 15px var(--disagree-color); }

        .vote-count {
            font-size: 16px;
            font-weight: bold;
        }
        .vote-label {
            font-size: 12px;
            color: #aaa;
            margin-top: 2px;
        }

        .vote-btn.disabled {
            background-color: #555 !important;
            cursor: not-allowed;
            opacity: 0.6;
            box-shadow: none !important;
        }
        #addModal .modal {
            /* 이 숫자를 늘리면 전체 내용이 아래로 내려갑니다 */
            padding-top: 90px; 
            /* 이 숫자를 늘리면 전체 내용이 위로 올라갑니다 (아래 여백) */
            padding-bottom: 40px; 
        }

        /* 2. '사어 매장하기' 제목 위치 */
        #addModal h2 {
            /* 제목을 아래로 밀어내기 */
            margin-top: 0px; 
            /* 제목과 입력창 사이 간격 벌리기 */
            margin-bottom: 30px; 
        }

        /* 3. 첫 번째 입력창 (단어) 위치 */
        #newWordInput {
            /* 위쪽 여백 (제목과 떨어뜨리기) */
            margin-top: 0px; 
        }

        /* 4. 두 번째 입력창 (뜻) 위치 */
        #newDescInput {
            /* 위쪽 여백 (첫 번째 입력창과 떨어뜨리기) */
            margin-top: 10px;
        }

        /* 5. '매장' 버튼 위치 */
        #addModal .modal-btn {
            /* 위쪽 여백 (입력창들과 떨어뜨리기) */
            margin-top: 5px; 
            
            /* (선택) 버튼 크기 조절 */
            width: 60px; 
        }
        
        /* ▼▼▼ [1] 닫기(X) 버튼 : 이건 지우지 말고 놔두거나, 위치 안 맞으면 숫자 조절하세요 ▼▼▼ */
        .modal-close {
            position: absolute;
            top: 180px;   /* 위아래 위치 */
            right: 25px;  /* 좌우 위치 */
            font-size: 30px;
            color: #ffffff;
            cursor: pointer;
            z-index: 10;
        }

        /* ▼▼▼ [2] 팝업창 내용물 위치 (새로운 절대 위치 방식) ▼▼▼ */
        
        /* 1. 팝업창(모달) 내부 여백 : 제목과 버튼이 들어갈 자리를 비워줍니다 */
        #infoModal .modal {
            padding-top: 120px;     /* 제목이 겹치지 않게 위쪽 공간 확보 */
            padding-bottom: 100px;  /* 버튼이 겹치지 않게 아래쪽 공간 확보 */
        }
        /* ==================================================
           [최종 통합] 사어 정보(투표) 팝업 위치 및 스타일
           ================================================== */

        /* 1. 팝업창(모달) 내부 여백 : 내용물이 겹치지 않게 공간 확보 */
        #infoModal .modal {
            /* 제목이 들어갈 윗공간 */
            padding-top: 130px;    
            /* 버튼이 들어갈 아랫공간 */
            padding-bottom: 90px; 
        }

        /* 2. 사어(제목) 위치 조절 */
        #infoModal #modalTitle {
            position: absolute;    /* 절대 위치 */
            
            /* ▼▼▼ 이 숫자를 바꿔서 위/아래 위치를 잡으세요 ▼▼▼ */
            top: 250px;            /* 위에서 110px 내려옴 */
            
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            margin: 0;
            text-align: center;
            
            /* 글자 스타일 */
            font-size: 36px;       /* 글자 크기 */
            font-weight: bold;
            color: #ffffff;           /* 글자색 */
            letter-spacing: -2px;  /* 자간 */
            line-height: 1.2;
            z-index: 10;
        }

        /* 3. 뜻(설명) 위치 조절 */
        #infoModal #modalDesc {
            position: absolute;    /* 절대 위치 */
            
            /* ▼▼▼ 이 숫자를 바꿔서 위/아래 위치를 잡으세요 ▼▼▼ */
            top: 310px;            /* 위에서 170px 내려옴 */
            
            left: 50%;
            transform: translateX(-50%);
            width: 70%;            /* 가로폭 */
            margin: 0;
            text-align: center;
            
            /* 글자 스타일 */
            font-size: 18px;
            color: #ffffff;           /* 글자색 */
            letter-spacing: 0.5px;
            line-height: 1.6;
            word-break: keep-all;
            z-index: 10;
        }

        /* 4. 투표 버튼(찬성/반대) 위치 조절 */
        #infoModal .vote-container {
            position: absolute;    /* 절대 위치 */
            
            /* ▼▼▼ 이 숫자를 바꿔서 위/아래 위치를 잡으세요 ▼▼▼ */
            bottom: 200px;          /* 바닥에서 45px 올라옴 */
            
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            margin: 0;
            z-index: 10;
        }
        /* ==================================================
           [신규] 햄버거 버튼 및 전체 목록 스타일
           ================================================== */
        
        /* 1. 우측 상단 햄버거 버튼 */
        .hamburger-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000; /* 헤더보다 위에 */
            
            background: transparent; /* 반투명 배경 */
            color: #000;
            border: none;
            
            font-size: 40px;
            width: 50px;
            height: 50px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
        }
        .hamburger-btn:hover {
            /* 배경색이 생기지 않게 transparent로 변경하거나 삭제 */
            background: transparent; 
            /* 테두리도 안 생기게 */
            border: none;
            /* 크기만 커지게 */
            transform: scale(1.2); 
            /* 글자색을 바꾸고 싶다면 */
            color: #8b0000; 
        }

        /* 2. 전체 목록 팝업창 (기존 모달과 다르게 넓게 씀) */
        /* ▼▼▼ [수정됨] 사어 목록 창을 이미지로 변경 ▼▼▼ */
        .list-modal-content {
            /* 1. 배경 이미지 설정 */
            background-image: url('https://i.imgur.com/SosNIbu.png.png'); 
            background-size: contain; /* 이미지가 잘리지 않고 다 보이게 */
            background-repeat: no-repeat;
            background-position: center;
            background-color: transparent; /* 기존 검은 배경 제거 */
            
            /* 2. 테두리와 그림자 제거 (이미지에 포함되어 있다면) */
            border: none;
            box-shadow: none; 

            /* 3. 크기 설정 (이미지 비율에 맞춰 조절 필요) */
            width: 100%;
            max-width: 710px; /* 너무 커지지 않게 제한 */
            height: 100%;      /* 화면 높이의 80% */
            
            /* 4. 내부 여백 (글자가 이미지 밖으로 나가지 않게 조절 필수!) */
            /* 순서대로: 위, 오른쪽, 아래, 왼쪽 */
            padding: 80px 60px 100px 60px; 
            
            /* 5. 정렬 설정 (그대로 유지) */
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* (선택사항) 목록 제목 스타일 수정 - 이미지 배경색에 맞춰 글자색 변경 */
        .list-modal-content h2 {
            text-align: center;
            color: #ffffff; /* 배경이 밝으면 #000000(검정)으로 바꾸세요 */
            margin-bottom: 0px;
            margin-top: 75px;
            padding-bottom: 10px;
        }

        /* 3. 목록 스크롤 영역 */
        .word-list-container {
            /* 1. 크기 및 스크롤 설정 */
            flex: none; 
            height: 650px !important;  /* 배경 그림에 맞춘 높이 */
            width: 100%;    /* 가로 꽉 채우기 */
            overflow-y: auto; /* 스크롤바 */
            
            /* 2. 위치 미세 조정 */
            margin-top: 10px;
            margin-bottom: 10px;
            
            /* 3. [핵심] 내용물 가운데 정렬을 위한 Flexbox 설정 */
            display: flex;
            flex-direction: column; /* 세로로 나열 */
            align-items: center;    /* ★가로 기준 가운데 정렬★ */
            
            /* 4. 스크롤바 때문에 생기는 오른쪽 여백 제거 (중앙 정렬 방해 요소) */
            padding-top: 5px;   /* 위에서부터 얼마나 내릴지 (Y축) */
            padding-left: 70px;  /* 왼쪽벽에서 얼마나 밀지 (X축) */
            padding-right: 0px;  /* 오른쪽 여백 */
        }

        /* ==================================================
           [수정] 목록 아이템(단어 카드) 디자인 및 크기 조절
           ================================================== */

        .word-item {
            /* 1. 가로 너비 조절 (가장 중요!) */
            width: 90%;       /* 100%는 꽉 차고, 80%~90%는 여백이 생김 */
            max-width: 500px; /* 아무리 넓어져도 이 이상은 안 커짐 */
            
            /* 2. 위치 정렬 (가운데 정렬) */
            /* 너비를 줄였을 때 카드가 가운데 오게 하려면 아래 줄 필수 */
            margin-left: auto;
            margin-right: auto;
            
            /* 3. 카드끼리의 세로 간격 */
            margin-bottom: 13px; /* 이 숫자를 늘리면 카드 사이가 멀어짐 */
            
            /* 4. 카드 내부 여백 (글자가 테두리에 안 붙게) */
            padding: 17px; 
            
            /* 5. 디자인 (배경색, 테두리 등) */
            background: rgba(255, 255, 255, 0.1); /* 반투명 배경 */
            border-radius: 10px;                  /* 둥근 모서리 */
            border: 1px solid rgba(255, 255, 255, 0.2); /* 테두리 선 */
            
            /* 6. 텍스트 정렬 */
            text-align: left; /* left: 왼쪽 정렬, center: 가운데 정렬 */
            
            /* 마우스 올렸을 때 부드럽게 변하는 효과 */
            transition: 0.2s;
            cursor: pointer;
        }

        /* 마우스 올렸을 때 효과 */
        .word-item:hover {
            background: rgba(255, 255, 255, 0.2); /* 배경 밝아짐 */
            border-color: var(--accent-color);    /* 테두리 색 바뀜 */
            transform: scale(1.02);               /* 살짝 커짐 (싫으면 이 줄 삭제) */
        }

        /* 제목 글자 스타일 */
        .word-item-title {
            font-size: 22px;        /* 글자 크기 */
            font-weight: bold;
            color: #fff;
            margin-bottom: 10px;    /* 설명과의 간격 */
        }

        /* 뜻(설명) 글자 스타일 */
        .word-item-desc {
            font-size: 15px;
            color: #ddd;
            line-height: 1.4;       /* 줄 간격 */
        }

        /* 찬성/반대 통계 스타일 */
        .word-item-stats {
            font-size: 13px;
            color: #aaa;
            margin-top: 14px;       /* 설명과의 간격 */
            text-align: right;      /* 오른쪽 구석에 배치 */
        }

        /* 5. 닫기 버튼 */
        .close-list {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 30px;
            color: #aaa;
            cursor: pointer;
        }
        .close-list:hover { color: #fff; }
        
        /* 스크롤바 예쁘게 */
        /* ▼▼▼ 목록(스크롤) 영역 크기 및 위치 상세 조절 ▼▼▼ */
        .word-list-container {
            /* 1. 자동 크기 조절 끄기 (높이를 내 맘대로 정하기 위해 필수!) */
            flex: none; 
            
            /* 2. 세로 높이 조절 (가장 중요!) */
            /* 이 숫자를 늘리거나 줄여서 배경 그림 칸에 맞추세요 */
            height: 700px; 
            
            /* 3. 가로 너비 조절 */
            width: 80%;  /* 100%면 꽉 채우고, 80% 등으로 줄일 수 있습니다 */
            
            /* 4. 위치 미세 조정 (여백) */
            margin-top: 20px;    /* 제목과 목록 사이 간격 */
            margin-bottom: 0px;  /* 아래쪽 여백 */
            
            /* 5. 스크롤 설정 (이건 그대로 두세요) */
            overflow-y: auto;
        }
        /* ▼▼▼ 스크롤바 디자인 수정 (목록 창) ▼▼▼ */
        
        /* 1. 스크롤바 전체 너비 */
        .word-list-container::-webkit-scrollbar {
            width: 10px;  /* 스크롤바 두께 (숫자가 클수록 두꺼워짐) */
        }

        /* 2. 스크롤바 뒷배경 (트랙) */
        .word-list-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3); /* 반투명한 검은색 */
            border-radius: 5px; /* 둥근 모서리 */
            margin: 10px 0; /* 위아래 여백 */
        }

        /* 3. 스크롤바 막대 (손잡이) */
        .word-list-container::-webkit-scrollbar-thumb {
            background: #888; /* 막대 색상 (회색) */
            border-radius: 5px; /* 둥근 모서리 */
            border: 2px solid transparent; /* 여백을 주기 위한 투명 테두리 */
            background-clip: content-box; /* 테두리 안쪽만 색칠 */
        }

        /* 4. 마우스 올렸을 때 막대 색상 변경 */
        .word-list-container::-webkit-scrollbar-thumb:hover {
            background: #999; /* 마우스 올리면 붉은색(테마색)으로 변함 */
        }
        /* ▼▼▼ [신규] 음악 버튼 스타일 ▼▼▼ */
        .music-btn {
            position: fixed;
            top: 20px;
            left: 20px; /* 좌측 상단 배치 */
            z-index: 1000;
            
            background: transparent;
            border: none;
            
            font-size: 30px; 
            cursor: pointer;
            transition: 0.3s;
            text-shadow: 0 0 5px rgba(0,0,0,0.8); /* 배경에 묻히지 않게 그림자 */
            
            /* 3. 정렬 */
            display: flex;
            align-items: center;
            justify-content: center;
            
            /* (중요) 너비/높이 설정 해제하거나 글자 크기에 맞춤 */
            width: auto;
            height: auto;
        }

        .music-btn:hover {
            transform: scale(1.2);   /* 커지기만 함 */
            background: transparent; /* 배경색 안 생기게 */
            border: none;
        }

        /* 재생 중일 때 (빙글빙글 + 초록색 빛) */
        .music-on {
            animation: spin 3s linear infinite;
            
            /* 테두리 대신 초록색 후광 효과 */
            text-shadow: 0 0 20px #00ff00; 
            border: none;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

    </style>
</head>
<body>
    <!-- ▼▼▼ [1] 배경음악 오디오 태그 (화면엔 안 보임) ▼▼▼ -->
    <!-- 'bgm.mp3' 부분을 실제 파일 경로로 바꾸세요 -->
    <audio id="bgmAudio" loop autoplay>
        <source src="https://ready-lavender-85r54zt9sd-bfd2asc2a3.edgeone.dev/말의%20묘역.mp3" type="audio/mp3">
    </audio>

    <!-- ▼▼▼ [2] 음악 ON/OFF 버튼 (좌측 상단) ▼▼▼ -->
    <button class="music-btn" onclick="toggleMusic()">🔇</button>

    <!-- ▼▼▼ [1] 우측 상단 햄버거 버튼 추가 ▼▼▼ -->
    <button class="hamburger-btn" onclick="openListModal()">☰</button>

    <!-- ▼▼▼ [2] 모든 사어 보기 목록 창 (모달) 추가 ▼▼▼ -->
    <div id="listModal" class="modal-overlay">
        <div class="list-modal-content">
            <span class="close-list" onclick="closeListModal()">&times;</span>
            <h2>매장 된 사어 목록</h2>
            <div id="wordListContainer" class="word-list-container">
                <!-- 자바스크립트가 여기에 목록을 채워넣습니다 -->
            </div>
        </div>
    </div>
    <div id="graveyard" class="graveyard-container"></div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="찾고 싶은 사어를 검색 하시오.">
    </div>

    <button class="add-btn" onclick="openAddModal()" title="사어 매장">
        <!-- '이미지주소' 부분에 원하시는 이미지 링크를 넣으세요 -->
        <img src="https://i.imgur.com/Bxhv7bM.png" alt="매장">
    </button>

    <!-- 정보 및 투표 모달 -->
    <div id="infoModal" class="modal-overlay">
        <div class="modal">
            <span class="modal-close" onclick="closeModal('infoModal')">&times;</span>
            <h2 id="modalTitle">사어</h2>
            <p id="modalDesc">뜻</p>
            
            <div class="vote-container">
                <div class="vote-btn-wrapper">
                    <button class="vote-btn agree" id="btnAgree" onclick="castVote('agree')">👍</button>
                    <span class="vote-count" id="countAgree">0</span>
                    <span class="vote-label">사어 찬성</span>
                </div>
                <div class="vote-btn-wrapper">
                    <button class="vote-btn disagree" id="btnDisagree" onclick="castVote('disagree')">👎</button>
                    <span class="vote-count" id="countDisagree">0</span>
                    <span class="vote-label">사어 반대</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 추가 모달 -->
    <div id="addModal" class="modal-overlay">
        <div class="modal">
            <span class="modal-close" onclick="closeModal('addModal')">&times;</span>
            <h2>사어 매장하기</h2>
            <input type="text" id="newWordInput" class="modal-input" placeholder="사어 (단어)">
            <input type="text" id="newDescInput" class="modal-input" placeholder="사어의 뜻">
            <button class="modal-btn action" onclick="addNewWord()">매장</button>
        </div>
    </div>

    <!-- Firebase SDK 로드 -->
    <!-- Firebase SDK 로드 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, push, set, update, runTransaction, remove } 
               from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCeBlDbjcxzatGi2pC5omaZiUyuqHt0-I4",
            authDomain: "dead-language-5dc67.firebaseapp.com",
            databaseURL: "https://dead-language-5dc67-default-rtdb.firebaseio.com",
            projectId: "dead-language-5dc67",
            storageBucket: "dead-language-5dc67.firebasestorage.app",
            messagingSenderId: "361907393714",
            appId: "1:361907393714:web:311807684225b2955f25ab",
            measurementId: "G-30GNR2SRQZ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dbRef = ref(db, 'graveyard');

        // 전역 변수 설정
        window.currentOpenedTombstoneId = null; 
        let placedTombstones = [];
        let allGraveyardData = null; // 전체 데이터 저장용
        
        const container = document.getElementById('graveyard');

        // 묘비 이미지 타입
        const TOMBSTONE_TYPES = [
            { idx: 0, url: "https://imgur.com/UnIAnaM.png", width: 90, height: 140 },
            { idx: 1, url: "https://imgur.com/xaJwCW1.png", width: 120, height: 90 },
            { idx: 2, url: "https://imgur.com/47GtJjO.png", width: 80, height: 150 },
            { idx: 3, url: "https://imgur.com/XcihaGS.png", width: 100, height: 150 },
            { idx: 4, url: "https://imgur.com/kMtI5MA.png", width: 92, height: 140 },
            { idx: 5, url: "https://imgur.com/4GCdtpS.png", width: 110, height: 152 }
        ];

        // 기본 단어 (DB가 비었을 때 초기화용)
        const DEFAULT_WORDS = [
            { word: "영포티", desc: "젊은 감각을 유지하려는 40대" },
            { word: "~충", desc: "특정 대상을 벌레에 비유" },
            { word: "김여사", desc: "운전 미숙 여성 비하" },
            { word: "딸배", desc: "배달원 비하 명칭" },
            { word: "짱깨", desc: "중국인 비하 명칭" },
            { word: "잼민이", desc: "무개념한 어린아이" },
            { word: "누칼협", desc: "누가 칼 들고 협박함?" },
            { word: "알빠노", desc: "내 알 바 아님" },
            { word: "-무새", desc: "앵무새처럼 같은 말 반복" },
            { word: "진지충", desc: "진지한 사람 비하" }
        ];

        // =========================================
        // 1. 데이터 로드 (실시간 리스너)
        // =========================================
        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            allGraveyardData = data; // 데이터 저장
            
            container.innerHTML = ''; // 화면 초기화
            placedTombstones = [];

            if (data) {
                // DB에 데이터가 있으면 렌더링
                Object.keys(data).forEach(key => {
                    const item = data[key];
                    createTombstone(key, item, false);
                });
            } else {
                // DB가 비어있으면 기본 데이터 추가
                DEFAULT_WORDS.forEach(w => {
                    const newRef = push(dbRef);
                    set(newRef, {
                        word: w.word,
                        desc: w.desc,
                        typeIdx: Math.floor(Math.random() * TOMBSTONE_TYPES.length),
                        x: Math.random() * (window.innerWidth - 100),
                        y: Math.random() * (window.innerHeight - 200) + 100,
                        agree: 0,
                        disagree: 0,
                        timestamp: Date.now()
                    });
                });
            }

            // 모달 업데이트
            if (window.currentOpenedTombstoneId && data && data[window.currentOpenedTombstoneId]) {
                const currentData = data[window.currentOpenedTombstoneId];
                document.getElementById('countAgree').innerText = currentData.agree || 0;
                document.getElementById('countDisagree').innerText = currentData.disagree || 0;
            } else if (window.currentOpenedTombstoneId && (!data || !data[window.currentOpenedTombstoneId])) {
                window.closeModal('infoModal');
            }
        });

        // =========================================
        // 2. 묘비 생성 함수
        // =========================================
        function createTombstone(id, data, isNew) {
            const el = document.createElement('div');
            el.classList.add('tombstone');
            
            let typeIdx = data.typeIdx !== undefined ? parseInt(data.typeIdx) : 0;
            const type = TOMBSTONE_TYPES.find(t => t.idx === typeIdx) || TOMBSTONE_TYPES[0];

            let posX = Math.min(Math.max(0, data.x), window.innerWidth - type.width);
            let posY = Math.min(Math.max(0, data.y), window.innerHeight - type.height);

            const tombData = {
                id: id,
                element: el,
                word: data.word,
                desc: data.desc,
                x: posX,
                y: posY,
                w: type.width,
                h: type.height,
                agree: data.agree || 0,
                disagree: data.disagree || 0
            };
            placedTombstones.push(tombData);

            el.style.width = type.width + 'px';
            el.style.height = type.height + 'px';
            el.style.left = posX + 'px';
            el.style.top = posY + 'px';
            el.dataset.imgIdx = type.idx; 
            
            // 5초간 빛나는 효과
            const now = Date.now();
            const createdTime = data.timestamp || 0;
            if (now - createdTime < 5000) {
                el.classList.add('just-born');
                setTimeout(() => {
                    el.classList.remove('just-born');
                }, 5000 - (now - createdTime));
            }

            el.innerHTML = `
                <img src="${type.url}" alt="tombstone">
                <div class="tombstone-text">${data.word}</div>
            `;

            el.onmousedown = (e) => startDrag(e, tombData);
            el.ontouchstart = (e) => startDrag(e, tombData);
            el.onclick = () => { if(!el.isDragging) showInfo(tombData); };
            
            // 우클릭 삭제 기능
            el.oncontextmenu = (e) => {
                e.preventDefault();
                if (confirm(`정말로 '${data.word}' 사어를 살리시겠습니까?`)) {
                    remove(ref(db, `graveyard/${id}`))
                        .catch((err) => alert("살리기 실패: " + err.message));
                }
            };

            container.appendChild(el);
        }

        // =========================================
        // 3. 드래그 앤 드롭
        // =========================================
        let currentDrag = null;
        let dragOffsetX, dragOffsetY, startX, startY;

        function startDrag(e, tombData) {
            if (e.type === 'mousedown' && e.button !== 0) return;
            if(e.type === 'mousedown') e.preventDefault();
            
            currentDrag = tombData;
            const el = tombData.element;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            dragOffsetX = clientX - el.getBoundingClientRect().left;
            dragOffsetY = clientY - el.getBoundingClientRect().top;
            startX = clientX;
            startY = clientY;
            el.isDragging = false;

            if (e.type === 'touchstart') {
                document.addEventListener('touchmove', onDrag, { passive: false });
                document.addEventListener('touchend', stopDrag);
            } else {
                document.addEventListener('mousemove', onDrag);
                document.addEventListener('mouseup', stopDrag);
            }
        }

        function onDrag(e) {
            if (!currentDrag) return;
            if(e.cancelable) e.preventDefault();

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            if (Math.abs(clientX - startX) > 5 || Math.abs(clientY - startY) > 5) {
                currentDrag.element.isDragging = true;
            }

            let x = clientX - dragOffsetX;
            let y = clientY - dragOffsetY;
            
            x = Math.max(0, Math.min(window.innerWidth - currentDrag.w, x));
            y = Math.max(0, Math.min(window.innerHeight - currentDrag.h, y));

            currentDrag.element.style.left = x + 'px';
            currentDrag.element.style.top = y + 'px';
            currentDrag.x = x;
            currentDrag.y = y;
        }

        function stopDrag() {
            if (currentDrag && currentDrag.element.isDragging) {
                update(ref(db, `graveyard/${currentDrag.id}`), {
                    x: currentDrag.x,
                    y: currentDrag.y
                });
            }
            currentDrag = null;
            document.removeEventListener('mousemove', onDrag);
            document.removeEventListener('mouseup', stopDrag);
            document.removeEventListener('touchmove', onDrag);
            document.removeEventListener('touchend', stopDrag);
        }

        // =========================================
        // 4. 모달, 투표, 기타 기능 (window 객체에 할당)
        // =========================================
        
        window.showInfo = function(data) {
            window.currentOpenedTombstoneId = data.id;
            const modal = document.getElementById('infoModal');
            document.getElementById('modalTitle').innerText = data.word;
            document.getElementById('modalDesc').innerText = data.desc;
            document.getElementById('countAgree').innerText = data.agree;
            document.getElementById('countDisagree').innerText = data.disagree;
            
            // 투표 여부 확인
            const votedList = JSON.parse(localStorage.getItem('votedTombstones') || '{}');
            const btnAgree = document.getElementById('btnAgree');
            const btnDisagree = document.getElementById('btnDisagree');

            if (votedList[data.id]) {
                btnAgree.classList.add('disabled');
                btnDisagree.classList.add('disabled');
            } else {
                btnAgree.classList.remove('disabled');
                btnDisagree.classList.remove('disabled');
            }

            modal.style.display = 'flex';
        }

        window.castVote = function(type) {
            if (!window.currentOpenedTombstoneId) return;
            const id = window.currentOpenedTombstoneId;
            const votedList = JSON.parse(localStorage.getItem('votedTombstones') || '{}');
            
            if (votedList[id]) {
                alert("이미 투표하셨습니다.");
                return;
            }

            const itemRef = ref(db, `graveyard/${id}`);
            runTransaction(itemRef, (post) => {
                if (post) {
                    if (type === 'agree') post.agree = (post.agree || 0) + 1;
                    else post.disagree = (post.disagree || 0) + 1;
                }
                return post;
            });
            
            votedList[id] = true;
            localStorage.setItem('votedTombstones', JSON.stringify(votedList));
            document.getElementById('btnAgree').classList.add('disabled');
            document.getElementById('btnDisagree').classList.add('disabled');
        }

        window.addNewWord = function() {
            const word = document.getElementById('newWordInput').value.trim();
            const desc = document.getElementById('newDescInput').value.trim();
            if (!word || !desc) { alert("단어와 뜻을 모두 입력해주세요."); return; }
            
            const newRef = push(dbRef);
            set(newRef, {
                word: word,
                desc: desc,
                typeIdx: Math.floor(Math.random() * TOMBSTONE_TYPES.length),
                x: Math.random() * (window.innerWidth - 100),
                y: Math.random() * (window.innerHeight - 200) + 100,
                agree: 0,
                disagree: 0,
                timestamp: Date.now() 
            });

            window.closeModal('addModal');
        }

        window.openAddModal = function() {
            document.getElementById('newWordInput').value = "";
            document.getElementById('newDescInput').value = "";
            document.getElementById('addModal').style.display = 'flex';
            document.getElementById('newWordInput').focus();
        }

        window.closeModal = function(modalId) {
            document.getElementById(modalId).style.display = 'none';
            if (modalId === 'infoModal') {
                window.currentOpenedTombstoneId = null;
            }
        }
        
        // 검색 기능
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', function() {
            const val = this.value.trim();
            placedTombstones.forEach(t => t.element.classList.remove('highlighted'));
            if (val === "") return;
            placedTombstones.forEach(t => {
                if (t.word.includes(val)) t.element.classList.add('highlighted');
            });
        });

        // 모달 닫기 (외부 클릭)
        window.onclick = function(e) {
            if (e.target.classList.contains('modal-overlay')) {
                // 클릭된 요소의 ID가 있으면 그 모달을 닫음
                if(e.target.id) window.closeModal(e.target.id);
            }
        }

        // ▼▼▼ [목록 기능] ▼▼▼
        window.openListModal = function() {
            const listModal = document.getElementById('listModal');
            const listContainer = document.getElementById('wordListContainer');
            
            listContainer.innerHTML = '';

            if (!allGraveyardData) {
                listContainer.innerHTML = '<p style="text-align:center; color:#ccc; margin-top:20px;">등록된 사어가 없습니다.</p>';
            } else {
                const dataArray = Object.entries(allGraveyardData).map(([key, value]) => {
                    return { id: key, ...value };
                });
                
                dataArray.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

                dataArray.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'word-item';
                    div.innerHTML = `
                        <div class="word-item-title">${item.word}</div>
                        <div class="word-item-desc">${item.desc}</div>
                        <div class="word-item-stats">
                            찬성 ${item.agree || 0} / 반대 ${item.disagree || 0}
                        </div>
                    `;
                    div.onclick = () => {
                        window.closeListModal();
                        const targetTomb = placedTombstones.find(t => t.id === item.id);
                        if(targetTomb) window.showInfo(targetTomb);
                        else alert("해당 묘비가 현재 화면에 로드되지 않았습니다.");
                    };
                    listContainer.appendChild(div);
                });
            }
            listModal.style.display = 'flex';
        }

        window.closeListModal = function() {
            document.getElementById('listModal').style.display = 'none';
        }
        // ▼▼▼ [신규] 음악 재생/정지 토글 함수 ▼▼▼
        window.toggleMusic = function() {
            const audio = document.getElementById('bgmAudio');
            const btn = document.querySelector('.music-btn');
            
            if (audio.paused) {
                audio.play(); // 음악 재생
                btn.innerHTML = "💿"; // 아이콘 변경 (원판)
                btn.classList.add('music-on'); // 빙글빙글 효과 추가
            } else {
                audio.pause(); // 음악 정지
                btn.innerHTML = "🔇"; // 아이콘 변경 (음소거)
                btn.classList.remove('music-on'); // 효과 제거
            }
        }
        
        // (선택사항) 사이트 접속 시 음악 볼륨을 50%로 설정
        document.getElementById('bgmAudio').volume = 0.5;

        window.onload = function() {
            const audio = document.getElementById('bgmAudio');
            const btn = document.querySelector('.music-btn');
            
            // 볼륨 설정 (0.0 ~ 1.0)
            audio.volume = 0.5; 

            // 자동 재생 시도
            var promise = audio.play();

            if (promise !== undefined) {
                promise.then(_ => {
                    // 성공! (아이콘 변경 및 빙글빙글 효과)
                    btn.innerHTML = "💿";
                    btn.classList.add('music-on');
                }).catch(error => {
                    // 실패! (브라우저 정책) -> 콘솔에만 기록하고 클릭을 기다림
                    console.log("자동 재생 차단됨. 사용자 클릭 대기 중...");
                });
            }
        };

        // 2. 화면 아무 곳이나 클릭(터치)했을 때 재생 (자동 재생 실패 대비)
        document.body.addEventListener('click', function() {
            const audio = document.getElementById('bgmAudio');
            const btn = document.querySelector('.music-btn');
            
            // 음악이 멈춰있는 상태라면 재생
            if (audio.paused) {
                audio.play();
                btn.innerHTML = "💿";
                btn.classList.add('music-on');
            }
        }, { once: true }); // 중요: 한 번만 실행되고 사라짐 (계속 실행되면 음악 껐는데 또 켜질 수 있음)

        // 2. 화면 아무 데나 클릭하면 음악 시작 (자동 재생 실패 대비)
        document.body.addEventListener('click', function() {
            const audio = document.getElementById('bgmAudio');
            const btn = document.querySelector('.music-btn');
            
            // 음악이 꺼져있다면 재생
            if (audio.paused) {
                audio.play();
                btn.innerHTML = "💿";
                btn.classList.add('music-on');
            }
        }, { once: true });

    </script>
</body>
</html>
